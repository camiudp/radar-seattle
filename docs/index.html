<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Radar Seattle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --fog: #EEF1EF;
    --surface: #FFFFFF;
    --ink: #18262F;
    --muted: #5B7180;
    --line: #D7DEDA;
    --evergreen: #24533F;
    --go: #2F8A57;
    --maybe: #C7880F;
    --stop: #B4433D;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fog: #121A1E; --surface: #1A252B; --ink: #E7EEEA; --muted: #93A8B3;
      --line: #2C3A41; --evergreen: #7CC4A0; --go: #5CC48A; --maybe: #E8B04A; --stop: #E07A73;
    }
  }
  :root[data-theme="dark"] {
    --fog: #121A1E; --surface: #1A252B; --ink: #E7EEEA; --muted: #93A8B3;
    --line: #2C3A41; --evergreen: #7CC4A0; --go: #5CC48A; --maybe: #E8B04A; --stop: #E07A73;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--fog); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.1rem 4rem; }
  a { color: var(--evergreen); }
  :focus-visible { outline: 3px solid var(--evergreen); outline-offset: 2px; border-radius: 4px; }

  header h1 {
    font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 700; line-height: 1.05;
    letter-spacing: -0.02em; margin: 0 0 .6rem; max-width: 16ch;
  }
  header p { margin: 0; color: var(--muted); }

  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 2rem 0 1rem; align-items: center; }
  .chip {
    font: inherit; font-size: .9rem; border: 1.5px solid var(--line); background: var(--surface);
    color: var(--ink); padding: .4rem .8rem; border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
  .search {
    flex: 1 1 180px; font: inherit; font-size: .95rem; padding: .45rem .8rem;
    border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink);
  }

  .list { background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .job { display: grid; grid-template-columns: 6px 1fr; border-top: 1px solid var(--line); }
  .job:first-child { border-top: 0; }
  .bar { background: var(--maybe); }
  .job[data-visa="green"] .bar { background: var(--go); }
  .job[data-visa="red"] .bar { background: var(--stop); }
  .body { padding: 1rem 1.1rem 1.1rem; min-width: 0; }
  .top { display: flex; gap: .6rem; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  .title { font-size: 1.15rem; font-weight: 700; line-height: 1.25; margin: 0; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .new { font-size: .8rem; font-weight: 700; color: var(--evergreen); white-space: nowrap; }
  .meta { color: var(--muted); font-size: .92rem; margin: .2rem 0 .6rem; }
  .visa { font-size: .92rem; margin: 0 0 .25rem; }
  .quote { font-size: .85rem; color: var(--muted); margin: 0 0 .6rem; font-style: italic; overflow-wrap: anywhere; }
  .rating { font-size: .92rem; margin: 0 0 .8rem; }
  .stale { color: var(--maybe); }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .btn {
    font-size: .9rem; text-decoration: none; padding: .4rem .85rem; border-radius: 8px;
    border: 1.5px solid var(--line); color: var(--ink); background: transparent;
  }
  .btn.apply { background: var(--evergreen); border-color: var(--evergreen); color: var(--surface); font-weight: 500; }

  .empty { padding: 2rem 1.2rem; color: var(--muted); }

  h2 { font-size: 1.3rem; margin: 3rem 0 .4rem; }
  .hint { color: var(--muted); font-size: .92rem; margin: 0 0 1rem; }
  .co { padding: .8rem 1.1rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .co:first-child { border-top: 0; }
  .co-name { font-weight: 500; }
  .co-status { color: var(--muted); font-size: .9rem; }
  .co-status.err { color: var(--stop); }

  @media (prefers-reduced-motion: no-preference) {
    .job { animation: in .25s ease-out both; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="headline">Revisando vacantes…</h1>
    <p id="sub"></p>
  </header>

  <div class="filters" role="group" aria-label="Filtros">
    <button class="chip" data-visa="green" aria-pressed="true">🟢 Patrocina</button>
    <button class="chip" data-visa="yellow" aria-pressed="true">🟡 No dice</button>
    <button class="chip" data-visa="red" aria-pressed="false">🔴 No patrocina</button>
    <button class="chip" id="onlyNew" aria-pressed="false">Solo nuevas</button>
    <input class="search" id="q" type="search" placeholder="Buscar cargo o empresa" aria-label="Buscar cargo o empresa">
  </div>

  <section class="list" id="jobs" aria-live="polite"></section>

  <h2>Empresas que sigue el robot</h2>
  <p class="hint">Si una aparece en rojo, revisa su <em>slug</em> o portal en companies.yaml.</p>
  <section class="list" id="companies"></section>
</main>

<script>
const state = { visa: new Set(["green", "yellow"]), onlyNew: false, q: "" };
let data = null;

const DAY = 86400000;
const daysSince = d => d ? Math.floor((Date.now() - new Date(d + "T12:00:00").getTime()) / DAY) : null;
const ago = d => {
  const n = daysSince(d);
  if (n === null) return "";
  if (n <= 0) return "hoy";
  if (n === 1) return "ayer";
  return `hace ${n} días`;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const VISA_ICON = { green: "🟢", yellow: "🟡", red: "🔴" };

function ratingHtml(co) {
  if (!co || co.rating == null) return `Sin nota de Glassdoor todavía`;
  const reviews = co.reviews != null ? ` (${co.reviews} reseñas)` : "";
  let checked = "";
  if (co.rating_checked) {
    const n = daysSince(co.rating_checked);
    checked = n > 60
      ? ` <span class="stale">revisada hace ${n} días, conviene actualizar</span>`
      : ` <span style="color:var(--muted)">revisada ${ago(co.rating_checked)}</span>`;
  }
  return `⭐ ${esc(co.rating)}${reviews}${checked}`;
}

function render() {
  const companies = Object.fromEntries((data.companies || []).map(c => [c.name, c]));
  const q = state.q.toLowerCase();
  const jobs = data.jobs.filter(j =>
    state.visa.has(j.visa.status) &&
    (!state.onlyNew || j.first_seen === data.today) &&
    (!q || (j.title + " " + j.company + " " + j.location).toLowerCase().includes(q))
  );

  const el = document.getElementById("jobs");
  if (!jobs.length) {
    el.innerHTML = `<p class="empty">No hay vacantes con estos filtros. Prueba activar 🟡 o quitar "Solo nuevas".</p>`;
  } else {
    el.innerHTML = jobs.map(j => {
      const co = companies[j.company] || {};
      const isNew = j.first_seen === data.today;
      return `
      <article class="job" data-visa="${j.visa.status}">
        <div class="bar" aria-hidden="true"></div>
        <div class="body">
          <div class="top">
            <h3 class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
            ${isNew ? `<span class="new">🆕 Nueva hoy</span>` : ""}
          </div>
          <p class="meta">${esc(j.company)}, ${esc(j.location || "sin ubicación")}${j.posted ? `, publicada ${ago(j.posted)}` : ""}</p>
          <p class="visa">${VISA_ICON[j.visa.status]} ${esc(j.visa.reason)}</p>
          ${j.visa.quote ? `<p class="quote">“${esc(j.visa.quote)}”</p>` : ""}
          <p class="rating">${ratingHtml(co)}</p>
          <div class="actions">
            <a class="btn apply" href="${esc(j.url)}" target="_blank" rel="noopener">Postular</a>
            <a class="btn" href="${esc(co.glassdoor_url)}" target="_blank" rel="noopener">Glassdoor</a>
            <a class="btn" href="${esc(co.indeed_url)}" target="_blank" rel="noopener">Indeed</a>
          </div>
        </div>
      </article>`;
    }).join("");
  }
}

function renderHeader() {
  const fresh = data.jobs.filter(j => j.first_seen === data.today && j.visa.status !== "red").length;
  const h = document.getElementById("headline");
  h.textContent = fresh === 0 ? "Hoy no hay vacantes nuevas, pero el robot sigue mirando."
    : fresh === 1 ? "Hoy hay 1 vacante nueva que calza contigo."
    : `Hoy hay ${fresh} vacantes nuevas que calzan contigo.`;
  const when = new Date(data.generated_at).toLocaleString("es-CL", { dateStyle: "medium", timeStyle: "short" });
  const ok = data.companies.filter(c => c.ok).length;
  document.getElementById("sub").textContent =
    `${data.jobs.length} vacantes en total y ${ok} de ${data.companies.length} empresas leídas. Última revisión: ${when}`;
}

function renderCompanies() {
  document.getElementById("companies").innerHTML = data.companies.map(c => `
    <div class="co">
      <span class="co-name">${esc(c.name)}${c.sponsor_history ? " 🟢" : ""}</span>
      <span class="co-status ${c.ok ? "" : "err"}">${c.ok
        ? `${esc(c.ats)}: ${c.total} avisos, ${c.matched} calzan`
        : `No se pudo leer (slug "${esc(c.slug)}")`}</span>
    </div>`).join("");
}

document.querySelectorAll(".chip[data-visa]").forEach(b => b.addEventListener("click", () => {
  const v = b.dataset.visa;
  state.visa.has(v) ? state.visa.delete(v) : state.visa.add(v);
  b.setAttribute("aria-pressed", state.visa.has(v));
  render();
}));
document.getElementById("onlyNew").addEventListener("click", e => {
  state.onlyNew = !state.onlyNew;
  e.currentTarget.setAttribute("aria-pressed", state.onlyNew);
  render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });

fetch("data/jobs.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { data = d; renderHeader(); render(); renderCompanies(); })
  .catch(() => {
    document.getElementById("headline").textContent = "Todavía no hay datos.";
    document.getElementById("sub").textContent =
      "Corre el robot una vez desde la pestaña Actions de GitHub (botón Run workflow) y vuelve a abrir esta página.";
  });
</script>
</body>
</html>
