# =============================================================
#  Radar de empleos - configuración
#  Este es el ÚNICO archivo que necesitas editar a mano.
# =============================================================

# --- Qué buscar en el título del cargo (basta con que calce una) ---
title_include:
  - analyst
  - analytics
  - data
  - business intelligence
  - insights
  - automation
  - bi engineer

# --- Títulos que no te interesan ---
title_exclude:
  - intern
  - internship
  - security analyst
  - legal

# --- Si la ubicación contiene alguna de estas, se descarta ---
location_exclude:
  - canada
  - india
  - united kingdom
  - europe
  - mexico city

# --- Áreas de la página. Cada empresa pertenece a una. ---
regions:
  seattle:
    label: Seattle
    location_include: [seattle, bellevue, redmond, kirkland, washington, ", wa", remote]
  miami:
    label: Miami / Weston
    location_include: [miami, weston, fort lauderdale, plantation, sunrise, doral, dania beach,
                       coral gables, boca raton, broward, florida, ", fl", remote]

# =============================================================
#  Empresas
#  region: seattle | miami
#  ats: auto | greenhouse | lever | ashby | workday
#    "auto" prueba variantes del slug en Greenhouse, Lever y Ashby,
#    y si nada funciona, busca links en careers_url.
#  slug: nombre de la empresa en la URL de su portal (jobs.lever.co/ESTO)
#  careers_url: página de empleos de la empresa (ayuda a detectar el portal)
#  workday_url: si usa Workday, pega aquí la URL base de su portal,
#    por ejemplo https://empresa.wd5.myworkdayjobs.com/NombreDelSitio
#  sponsor_history: true si ya confirmaste que ha patrocinado visas.
#  glassdoor: completa a mano (rating, reviews, checked = AAAA-MM-DD).
#
#  Las careers_url marcadas "verificar" son mi mejor suposición: si la
#  empresa sale en rojo en la página, revisa esa URL primero.
# =============================================================
companies:
